# Databricks App manifest — read by the runtime when the container starts.
#
# This is the TEMPLATE app.yaml. scripts/finalize_app.sh renders the deployed
# app.yaml from it: keeps this header + command + scopes + binding-derived env,
# and appends the plain-value env vars (DEMO_CATALOG, DASHBOARD_ID,
# GENIE_SPACE_ID, …) harvested from the setup job's export_resources output.
# Plain values live in exactly one place (finalize_app.sh), assembled after
# the job runs — the bundle can't know the Genie/KA/MAS IDs at deploy time.
# Binding-derived vars (DATABRICKS_WAREHOUSE_ID, LAKEBASE_ENDPOINT) stay here.
#
# Lifecycle on the Apps container (in order):
#   1. `npm install` against the shipped lockfile.
#   2. `npm run build` (no-op echo — real build runs locally via
#      scripts/build-app.sh and dist/ ships via DAB sync.include).
#   3. The `command:` below starts the server.

command: ['node', '--env-file-if-exists=.env', 'dist/server.js']

# Scopes minted into the user's OBO token (x-forwarded-access-token).
user_authorization:
  scopes:
    - model-serving      # OpenAI Agents loop hits /serving-endpoints/responses
    - genie              # ask_data → Genie space
    - sql                # warehouse-backed analytics queries
    - postgres           # Lakebase pool
    - ai-gateway         # AI Gateway routing for the Responses API
    - catalog.catalogs:read
    - catalog.schemas:read
    - catalog.tables:read

env:
  - name: NODE_ENV
    value: production

  # ── Warehouse (bound resource) ───────────────────────────────────────
  # DATABRICKS_WAREHOUSE_ID comes from the `sql-warehouse` app resource
  # binding (databricks apps update --resources / DAB apps.<key>.resources).
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # Mirror into WAREHOUSE_ID for config/app.json placeholder resolution.
  - name: WAREHOUSE_ID
    valueFrom: sql-warehouse

  # ── Lakebase (Autoscale — plain env, NOT a resource binding) ─────────
  # This workspace runs Autoscale Lakebase (projects/branches/endpoints), not
  # a classic instance, so there is no `postgres` app-resource to bind. The
  # AppKit lakebase plugin connects via these env vars directly + OAuth
  # (generateDatabaseCredential). PGPORT/PGSSLMODE are also set here since the
  # platform only auto-injects PG* for a classic postgres binding.
  - name: LAKEBASE_ENDPOINT
    value: projects/sentinel-payments/branches/production/endpoints/primary
  - name: PGHOST
    value: ep-wandering-boat-d83925kg.database.us-east-2.cloud.databricks.com
  - name: PGDATABASE
    value: databricks_postgres
  - name: PGPORT
    value: "5432"
  - name: PGSSLMODE
    value: require

  # ── Governed data + Genie (normally injected by finalize_app.sh from the
  # setup job's export_resources; set here for the direct-deploy path). ──
  - name: DEMO_CATALOG
    value: serverless_scottj_techsummit_catalog
  - name: DEMO_SCHEMA
    value: sent_benefits
  - name: GENIE_SPACE_ID
    value: 01f1a23080a2179688ecae418471b534
  # The published "Sentinel Payment Integrity" AI/BI dashboard embedded on the
  # /dashboard page. (config/app.json's default was a stale UUID from another
  # demo that doesn't exist in this workspace, leaving the page blank.)
  - name: DASHBOARD_ID
    value: 01f1a230f029141a91588c0104aa8467
